name: Python application

on: push

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: python -m pip install ruff==0.14.5

      - name: Lint code with Ruff
        run: ruff check --output-format=github --target-version=py310 .

      - name: Check code formatting with Ruff
        run: ruff format --check .
        continue-on-error: true

  test:
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.10', '3.12']

    env:
      PROXY: ${{ secrets.PROXY }}
      TEST_TESTNET: 'true'
      TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
      TEST_API_SECRET: ${{ secrets.TEST_API_SECRET }}
      TEST_FUTURES_API_KEY: ${{ secrets.TEST_FUTURES_API_KEY }}
      TEST_FUTURES_API_SECRET: ${{ secrets.TEST_FUTURES_API_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pyright tox
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f test-requirements.txt ]; then
            python -m pip install -r test-requirements.txt
          fi

      - name: Type check with pyright (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: pyright

      - name: Test with tox
        env:
          TOX_OVERRIDE: "testenv.base_python=python${{ matrix.python-version }}"
        run: |
          python --version
          tox -e py

      - name: Coveralls Parallel
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          parallel: true

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

